import com.modrinth.minotaur.dependencies.DependencyType
import com.modrinth.minotaur.dependencies.ModDependency
import net.darkhax.curseforgegradle.Constants as CFConstants
import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
	id 'net.fabricmc.fabric-loom' version '1.16.+'
}

base {
	archivesName = "$mod_name-$mc_version-fabric"
}

println "Fabric API: $fabric_version, Loader: $loader_version"

loom {
	runs {
		configureEach {
			ideConfigGenerated(true)
			runDir('../run')
		}

		client {
			client()

			setConfigName('Fabric: Client')
		}

		server {
			server()

			setConfigName('Fabric: Server')
		}
	}

	mixin {
		useLegacyMixinAp = false
	}

	accessWidenerPath.set(file("src/main/resources/${mod_id}.classtweaker"))
}

dependencies {
	minecraft "com.mojang:minecraft:$mc_version"

	compileOnly project(':Common')

	implementation "net.fabricmc:fabric-loader:$loader_version"
	implementation "net.fabricmc.fabric-api:fabric-api:$fabric_version+$mc_version"

	implementation "maven.modrinth:modmenu:$modmenu_version"

	compileOnly "com.github.glitchfiend:SereneSeasons-fabric:$mc_version-$sereneseasons_version"
	compileOnly "com.github.glitchfiend:GlitchCore-fabric:$mc_version-$glitchcore_version"

	compileOnly "net.caffeinemc:sodium-fabric:$sodium_version+mc$mc_version"
	compileOnly "maven.modrinth:iris:$iris_version+26.1-fabric" // Update to 26.1.2

	// Iris libs
    localRuntime 'org.antlr:antlr4-runtime:4.13.1'
    localRuntime 'io.github.douira:glsl-transformer:3.0.0-pre3'
    localRuntime 'org.anarres:jcpp:1.4.14'

	runtimeOnly 'me.lucko:fabric-permissions-api:0.3.1'
	runtimeOnly "maven.modrinth:spark:$spark_version-fabric"

	compileOnly "org.projectlombok:lombok:$lombok_version"
	annotationProcessor "org.projectlombok:lombok:$lombok_version"
}

sourcesJar {
	from project(':Common').sourceSets.main.allSource
}

artifacts {
	archives jar
	archives sourcesJar
}

project.evaluationDependsOn(':Changelog')

tasks.register('publishCurseForge', TaskPublishCurseForge) {
	dependsOn(tasks.jar)
	dependsOn(':Changelog:makeHtmlChangelog')

	apiToken = System.getenv('CURSEFORGE_TOKEN')

	var modFile = upload('937011', tasks.jar.archiveFile)
	modFile.displayName = "${base.archivesName.get()}-$version"
	modFile.releaseType = "$mod_version_label"
	modFile.addGameVersion(mc_version, 'client')
	modFile.addModLoader 'Fabric'
	modFile.addJavaVersion "Java $java_version"
	modFile.addRequirement 'fabric-api'

	modFile.changelogType = CFConstants.CHANGELOG_HTML
	modFile.changelog = file("${project(':Changelog').projectDir}/changelog.html").getText().replace([ '${version}': "$mc_version-$version" ])
}

modrinth {
	token = System.getenv('MODRINTH_TOKEN')

	projectId = 'fbp-renewed'

	versionName = "${base.archivesName.get()}-$version"
	versionNumber = "$version+fabric"
	versionType = "$mod_version_label"

	gameVersions = [ mc_version ]
	loaders = [ 'fabric' ]

	dependencies = [
			new ModDependency('P7dR8mSH', DependencyType.REQUIRED)
	]

	changelog = provider { file("${project(':Changelog').projectDir}/changelog.md").getText().replace([ '${version}': "$mc_version-$version" ]) }

	uploadFile = tasks.jar
	additionalFiles = [ tasks.sourcesJar ]
}

tasks.modrinth.dependsOn(tasks.jar)
tasks.modrinth.dependsOn(tasks.sourcesJar)

tasks.modrinth.dependsOn(':Changelog:makeMarkdownChangelog')
