name: 'Publish'

on: workflow_dispatch

permissions:
  contents: write
  statuses: write

jobs:
  build:
    name: 'Build'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        loader: [ 'Forge', 'Fabric', 'NeoForge' ]

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 'Set up JDK 17'
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 'Build ${{ matrix.loader }} with Gradle'
        run: ./gradlew :${{ matrix.loader }}:build

      - name: 'Upload ${{ matrix.loader }} artifacts'
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: 'Artifacts-${{ matrix.loader }}'
          path: |
            ${{ matrix.loader }}/build/libs/*.jar
            !${{ matrix.loader }}/build/libs/*-slim.*

  changelog:
    name: 'Generate changelog'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 'Set up JDK 17'
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 'Generate changelog with Gradle'
        run: ./gradlew makeChangelog

      - name: 'Upload changelog'
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: 'Changelog'
          path: Changelog/changelog.*

  publish:
    name: 'Publish'
    runs-on: ubuntu-latest

    needs: [build, changelog]

    continue-on-error: true

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 'Set up JDK 17'
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 'Download changelog'
        uses: actions/download-artifact@v4
        with:
          name: 'Changelog'
          path: Changelog/

      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 'Publish with Gradle'
        run: ./gradlew publishMod
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}